# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - CERF-3RM

on:
  push:
    branches:
      - port-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The Azure App Service container is Python 3.12 (matches dev). We
      # compile app/pyproject.toml against 3.12 / linux into a repo-root
      # requirements.txt that Oryx picks up and pip-installs on the server
      # during deploy. pyproject.toml stays the source of truth;
      # requirements.txt is a transient build artifact (gitignored).
      - name: Generate requirements.txt (Python 3.12, linux)
        run: |
          uv pip compile \
            --python-version 3.12 \
            --python-platform linux \
            app/pyproject.toml \
            -o requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.venv/
            !app/__marimo__/
            !experimental/
            !.git/
            !.github/
            !.claude/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'CERF-3RM'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_45BF12C7C934413A8329FBDC7B129B4E }}

# -----------------------------------------------------------------------------
# Azure App Service runtime setup (NOT configured by this workflow — these
# settings live in the Azure Portal and persist between deploys):
#
# 1. Startup Command
#    Portal: CERF-3RM > Settings > Configuration > Stack settings > Startup Command
#      python -m marimo run app/cerf_predictor.py --host 0.0.0.0 --port 8000 --headless
#    --host 0.0.0.0 is required so the App Service front-end proxy can reach
#    marimo; --headless disables the browser-launch behaviour.
#
# 2. Python version: 3.12 (matches local dev).
#
# 3. Environment variables (Portal: Settings > Environment variables):
#    DSCI_AZ_BLOB_DEV_SAS and any other DSCI_* SAS tokens the ocha_stratus
#    blob reads need. Mirror what's in the developer's local shell env.
#
# 4. App setting SCM_DO_BUILD_DURING_DEPLOYMENT=true (Azure sets this
#    automatically when GitHub CI/CD is enabled). Oryx reads the
#    requirements.txt this workflow generates and pip-installs on the server.
#
# 5. Deploy artifact excludes: .venv/, app/__marimo__/, experimental/,
#    .git/, .github/, .claude/.
#    experimental/ holds the conflict-enabled exploratory marimo app and is
#    intentionally NOT shipped to production — the v1 production app is
#    app/cerf_predictor.py only.
# -----------------------------------------------------------------------------
